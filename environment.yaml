# ================================================================================
# RPI Reinforcement Learning Environment
# ================================================================================
#
# USAGE INSTRUCTIONS:
#   1. Create & Activate the environment:
#      conda env create -f environment.yaml
#      conda activate rpi-rl-env
#
# This environment includes:
# All dependencies with pinned versions for reproducibility
# ================================================================================

name: rpi-rl-env
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version - exact version from your environment
  - python=3.12.12

  # Pip for installing Python packages
  - pip

